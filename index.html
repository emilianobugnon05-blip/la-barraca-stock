
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LA BARRACA STOCK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #172033;
    }
    .contenedor {
      max-width: 420px;
      margin: 60px auto;
      padding: 24px;
    }
    .tarjeta {
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { text-align: center; color: #2563eb; }
    p { text-align: center; color: #64748b; }
    label { display: block; margin-top: 18px; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      margin-top: 24px;
      cursor: pointer;
    }
    #mensaje { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="contenedor">
    <div class="tarjeta">
      <h1>LA BARRACA STOCK</h1>
      <p>Sistema de gestión comercial</p>

      <form id="login">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" required
               autocomplete="username">

        <label for="clave">Contraseña</label>
        <input id="clave" type="password" required
               autocomplete="current-password">

        <button type="submit">Ingresar</button>
      </form>

      <p id="mensaje" role="status"></p>
    </div>
    
<section id="seccionBusqueda" style="margin-top:25px">
  <h2>Consultar productos</h2>
  <input id="busqueda"
         placeholder="Nombre o código de barras">
  <button type="button" onclick="buscarProducto()">
    Buscar producto
  </button>
  <div id="resultadoBusqueda"></div>
</section>

<section style="margin-top:25px">
  <h2>Escanear código de barras</h2>
  <button type="button" onclick="iniciarCamara()">
    Abrir cámara
  </button>
  <div id="lector" style="width:100%;margin-top:15px"></div>
</section>

  </main>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
  const supabaseUrl = "https://iyrqarpotyckzozhnswx.supabase.co";
  const supabaseKey = "sb_publishable_HGEpi6b5IGWMo9zsNkBXLA_zn6HtSN3";

  const db = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

  document.getElementById("login")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      const correo = document.getElementById("correo").value;
      const clave = document.getElementById("clave").value;
      const mensaje = document.getElementById("mensaje");

      mensaje.textContent = "ingresando...";

const { data, error } = await db.auth.signInWithPassword({
  email: correo,
  password: clave
});

if (error) {
  mensaje.textContent = "Error: " + error.message;
  return;
}

      const { data: perfil, error: errorPerfil } = await db
        .from("perfiles")
        .select("nivel")
        .eq("usuario_id", data.user.id)
        .single();

      if (errorPerfil || !perfil) {
        mensaje.textContent = "No se pudo verificar tu nivel de acceso.";
        await db.auth.signOut();
        return;
      }

      mensaje.textContent =
        "¡Bienvenido a La Barraca Stock! Nivel de acceso: " +
        perfil.nivel;
      document.getElementById("login").style.display = "none";
mensaje.innerHTML = `
  <h2>Panel principal</h2>
  <p>Bienvenido al sistema de La Barraca</p>
  <p>Tu nivel de acceso: ${perfil.nivel}</p>
  
<h3>Sector de ventas</h3>
<button type="button" onclick="mostrarPantallaVentas()">
  Abrir pantalla de ventas
</button>
<div id="pantallaVentas"></div>
  
  <h3>Cargar producto</h3>

<input id="codigoProducto" placeholder="Código de barras">

<button type="button" onclick="escanearParaCargar()">
  📷 Escanear para cargar
</button>

<input id="nombreProducto" placeholder="Nombre del producto">
<input id="precioProducto" type="number" placeholder="Precio de venta">
<input id="stockProducto" type="number" placeholder="Cantidad disponible">
<input id="ubicacionProducto" placeholder="Ubicación (opcional)">

<button type="button" onclick="guardarProducto()">
  Guardar producto
</button>

<p id="resultadoProducto"></p>
`;
    });
  
window.guardarProducto = async function() {
  const codigo_barras = document.getElementById("codigoProducto").value.trim();
  const nombre = document.getElementById("nombreProducto").value.trim();
  const precio_venta = Number(document.getElementById("precioProducto").value);
  const stock = Number(document.getElementById("stockProducto").value);
  const ubicacion = document.getElementById("ubicacionProducto").value.trim();
  const resultado = document.getElementById("resultadoProducto");

  if (!codigo_barras || !nombre || !precio_venta ||
      !Number.isInteger(stock) || stock < 0) {
    resultado.textContent = "Completá correctamente los datos.";
    return;
  }

  resultado.textContent = "Guardando producto...";

  const { error } = await db.from("productos").insert({
    codigo_barras,
    nombre,
    precio_venta,
    stock,
    ubicacion
  });

  if (error) {
    resultado.textContent = "Error: " + error.message;
  } else {
    resultado.textContent = "¡Producto guardado correctamente!";
  }
}

async function buscarProducto() {
  const busqueda = document.getElementById("busqueda").value.trim();
  const resultado = document.getElementById("resultadoBusqueda");

  if (!busqueda) {
    resultado.textContent = "Ingresá un nombre o código.";
    return;
  }

  resultado.textContent = "Buscando...";

  const { data, error } = await db
    .from("productos")
    .select("nombre,codigo_barras,precio_venta,stock,ubicacion")
    .or(`nombre.ilike.%${busqueda.replace(/[%_,().]/g, "")}%,codigo_barras.ilike.%${busqueda.replace(/[%_,().]/g, "")}%`)
    .limit(20);

  if (error) {
    resultado.textContent = "Error: " + error.message;
    return;
  }

  resultado.replaceChildren();

  if (!data.length) {
    resultado.textContent = "No se encontraron productos.";
    return;
  }

  data.forEach(p => {
    const item = document.createElement("p");
    item.textContent =
      `${p.nombre} | Código: ${p.codigo_barras} | Precio: $${p.precio_venta} | Stock: ${p.stock} | Ubicación: ${p.ubicacion || "-"}`;
    resultado.appendChild(item);
  });
}
    
function mostrarPantallaVentas() {
  const pantalla = document.getElementById("pantallaVentas");

  if (!pantalla) return;

  pantalla.innerHTML = `
    <h2>Ventas - La Barraca</h2>
    <input id="codigoVenta"
      placeholder="Escanear código de barras">

    <input id="cantidadVenta"
      type="number"
      min="1"
      value="1"
      placeholder="Cantidad">

    <button type="button"
      onclick="buscarParaVenta()">
      Buscar producto
    </button>

    <div id="resultadoVenta"></div>
      
<h3>Carrito de compras</h3>
<div id="listaCarrito"></div>
<h2 id="totalVenta">Total: $0</h2>

<button type="button" id="botonFinalizarVenta"
  onclick="finalizarVenta()">
  Finalizar venta
</button>
<p id="mensajeVenta"></p>

  `;


}

let carritoVentas = [];

function calcularTotalVenta() {
  return carritoVentas.reduce(
    (total, producto) =>
      total + producto.precio * producto.cantidad,
    0
  );
}

async function buscarParaVenta() {
  const codigo = document.getElementById("codigoVenta").value.trim();
  const resultado = document.getElementById("resultadoVenta");

  if (!codigo) {
    resultado.textContent = "Ingresá un código de barras.";
    return;
  }

  resultado.textContent = "Buscando producto...";

  const { data, error } = await db
    .from("productos")
    .select("id,nombre,codigo_barras,precio_venta,stock")
    .eq("codigo_barras", codigo)
    .maybeSingle();

  if (error) {
    resultado.textContent = "Error: " + error.message;
    return;
  }

  if (!data) {
    resultado.textContent = "Producto no encontrado.";
    return;
  }

 
resultado.replaceChildren();

const informacion = document.createElement("p");
informacion.textContent =
  data.nombre + " | Precio: $" + data.precio_venta +
  " | Stock: " + data.stock;

const botonAgregar = document.createElement("button");
botonAgregar.type = "button";
botonAgregar.textContent = "Agregar al carrito";

botonAgregar.onclick = function() {
  cargarProductoAlCarrito(data);
};

resultado.appendChild(informacion);
resultado.appendChild(botonAgregar);
 
}

function agregarAlCarrito(producto, cantidad) {
  cantidad = Number(cantidad);

  if (!Number.isInteger(cantidad) || cantidad <= 0) {
    alert("Ingresá una cantidad válida.");
    return;
  }

  const existente = carritoVentas.find(
    p => p.id === producto.id
  );

  const cantidadTotal = cantidad +
    (existente ? existente.cantidad : 0);

  if (cantidadTotal > producto.stock) {
    alert("No hay suficiente stock disponible.");
    return;
  }

  if (existente) {
    existente.cantidad = cantidadTotal;
  } else {
    carritoVentas.push({
      id: producto.id,
      nombre: producto.nombre,
      precio: Number(producto.precio_venta),
      cantidad: cantidad,
      stock: producto.stock
    });
  }

  mostrarCarrito();
}

function mostrarCarrito() {
  const lista = document.getElementById("listaCarrito");
  const total = document.getElementById("totalVenta");

  if (!lista || !total) return;

  lista.replaceChildren();

  carritoVentas.forEach(producto => {
    const item = document.createElement("p");

    item.textContent =
      producto.nombre + " | Cantidad: " +
      producto.cantidad + " | Subtotal: $" +
      (producto.precio * producto.cantidad);

    lista.appendChild(item);
  });

  total.textContent = "Total: $" + calcularTotalVenta();
}


function cargarProductoAlCarrito(producto) {
  const cantidad = Number(
    document.getElementById("cantidadVenta").value
  );

  agregarAlCarrito(producto, cantidad);
}

async function finalizarVenta() {
  if (carritoVentas.length === 0) {
    alert("El carrito está vacío.");
    return;
  }

  const boton = document.getElementById("botonFinalizarVenta");
  const mensaje = document.getElementById("mensajeVenta");

  if (boton) boton.disabled = true;
  if (mensaje) mensaje.textContent = "Registrando venta...";

  try {
    const { data, error } = await db.rpc(
      "registrar_venta",
      {
        p_productos: carritoVentas.map(p => ({
          producto_id: p.id,
          cantidad: p.cantidad
        }))
      }
    );

    if (error) throw error;

    carritoVentas = [];
    mostrarCarrito();

    if (mensaje) {
      mensaje.textContent = "¡Venta registrada correctamente!";
    }

    alert("Venta registrada. Stock actualizado.");

  } catch (error) {
    if (mensaje) {
      mensaje.textContent = "Error: " + error.message;
    }
  } finally {
    if (boton) boton.disabled = false;
  }
}

let lectorCamara = null;
let camaraActiva = false;

async function iniciarCamara() {
  if (camaraActiva) return;

  if (typeof Html5Qrcode === "undefined") {
    alert("No se pudo cargar el lector de códigos.");
    return;
  }

  lectorCamara = new Html5Qrcode("lector");

  try {
    camaraActiva = true;

    await lectorCamara.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 150 }
      },
      async (codigo) => {
        await lectorCamara.stop();
        camaraActiva = false;

document.getElementById("busqueda").value = codigo;
document.getElementById("codigoProducto").value = codigo;
await buscarProducto();

      },
      () => {}
    );
  } catch (error) {
    camaraActiva = false;
    alert("No se pudo abrir la cámara: " + error.message);
  }
}

function escanearParaCargar() {
  const codigo = document.getElementById("busqueda").value.trim();

  if (codigo) {
    document.getElementById("codigoProducto").value = codigo;
  }

  document.getElementById("lector").scrollIntoView({
    behavior: "smooth"
  });

  alert("Escaneá el producto con la cámara y después tocá nuevamente 'Escanear para cargar' para copiar el código.");
  iniciarCamara();
}

</async function verInformeVentas() {
  const informe = document.getElementById("informeVentas");
  informe.textContent = "Cargando ventas...";

  const { data: { user } } = await db.auth.getUser();

  if (!user) {
    informe.textContent = "Iniciá sesión.";
    return;
  }

  const { data: perfil } = await db
    .from("perfiles")
    .select("nivel")
    .eq("usuario_id", user.id)
    .single();

  if (perfil?.nivel !== 1) {
    informe.textContent = "Acceso no autorizado.";
    return;
  }

  const { data, error } = await db
    .from("ventas")
    .select("fecha,total")
    .order("fecha", { ascending: false });

  if (error) {
    informe.textContent = "Error: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    informe.textContent = "Todavía no hay ventas.";
    return;
  }

  const resumen = {};

  data.forEach(venta => {
    const fecha = new Date(venta.fecha)
      .toLocaleDateString("es-AR");

    if (!resumen[fecha]) {
      resumen[fecha] = { cantidad: 0, total: 0 };
    }

    resumen[fecha].cantidad++;
    resumen[fecha].total += Number(venta.total);
  });

  informe.replaceChildren();

  Object.entries(resumen).forEach(([fecha, datos]) => {
    const linea = document.createElement("p");
    linea.textContent =
      fecha + " | Ventas: " + datos.cantidad +
      " | Total: $" + datos.total.toLocaleString("es-AR");
    informe.appendChild(linea);
  });
}
</script>
