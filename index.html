
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LA BARRACA STOCK</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #172033;
    }
    .contenedor {
      max-width: 420px;
      margin: 60px auto;
      padding: 24px;
    }
    .tarjeta {
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { text-align: center; color: #2563eb; }
    p { text-align: center; color: #64748b; }
    label { display: block; margin-top: 18px; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      margin-top: 24px;
      cursor: pointer;
    }
    #mensaje { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="contenedor">
    <div class="tarjeta">
      <h1>LA BARRACA STOCK</h1>
      <p>Sistema de gestión comercial</p>

      <form id="login">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" required
               autocomplete="username">

        <label for="clave">Contraseña</label>
        <input id="clave" type="password" required
               autocomplete="current-password">

        <button type="submit">Ingresar</button>
      </form>

      <p id="mensaje" role="status"></p>
    </div>
  </main>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = "https://iyrqarpqtyckzozhnswx.supabase.co";
  const supabaseKey = "sb_publishable_HGEpi6b5IGWMo9zsNkBXLA_zn6HtSN3";

  const db = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );

  document.getElementById("login")
    .addEventListener("submit", async function(event) {
      event.preventDefault();

      const correo = document.getElementById("correo").value;
      const clave = document.getElementById("clave").value;
      const mensaje = document.getElementById("mensaje");

      mensaje.textContent = "Ingresando...";

     try {
  const respuesta = await fetch(
    supabaseUrl + "/auth/v1/health",
    { headers: { apikey: supabaseKey } }
  );

  mensaje.textContent =
    "Conexión Supabase: " + respuesta.status;
} catch (e) {
  mensaje.textContent =
    "Error de conexión: " + e.message;
  return;
     }
      const { data, error } = await db.auth.signInWithPassword({
        email: correo,
        password: clave
      });

      if (error) {
        mensaje.textContent = "Error: " + error.message;
        return;
      }

      const { data: perfil, error: errorPerfil } = await db
        .from("perfiles")
        .select("nivel")
        .eq("usuario_id", data.user.id)
        .single();

      if (errorPerfil || !perfil) {
        mensaje.textContent = "No se pudo verificar tu nivel de acceso.";
        await db.auth.signOut();
        return;
      }

      mensaje.textContent =
        "¡Bienvenido a La Barraca Stock! Nivel de acceso: " +
        perfil.nivel;
    });
</script>

</body>
</html>
